    <!-- Thème posé avant le premier rendu : choix mémorisé, sinon préférence système -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mirado.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          if (theme === 'dark')
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141311');
          var lang = localStorage.getItem('mirado.lang');
          if (lang === 'en' || lang === 'fr') document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
